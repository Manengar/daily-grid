<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily Grid">
<meta name="theme-color" content="#F5F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
<title>Daily Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* VOICE: a quiet morning ritual; editorial, exact, a little witty
   IDEA: the day's puzzle page in a good newspaper: a dateline, a standfirst, then tidy columns by section
   PICTURE: the segmented progress rule under the greeting, one segment per game, filling in cobalt
   COLOUR and TYPE: warm paper, charcoal ink, cobalt accent only for state; Newsreader for display, Geist for UI
   LAYOUT: single 600px column, sections with hairline rules, bottom toolbar for one-thumb search/add/edit

   DESIGN SYSTEM
   Space   4 · 8 · 12 · 16 · 24 · 32 · 48            (--s1 … --s7)
   Type    display 34/1.05 Newsreader 400 · title 22/1.2 Newsreader · body 16/1.4 Geist 500 ·
           meta 13/1.35 Geist 400 · label 13/1 Geist 600
   Radius  4 (controls inner) · 6 (marks, inputs) · 8 (buttons, sheets)
   Lines   1px --line hairlines; 1px --line-2 for control borders; no shadows except the modal sheet
   Size    touch targets 44px; row 60px; mark 30px; checkbox 24px
   States  hover: --hover fill · press: --press fill + 98% scale on buttons · focus: 2px --accent ring offset 2 ·
           done: ink-3 text, mark at 45%, filled cobalt checkbox · motion 140–180ms ease-out */
:root{color-scheme:light dark;
--bg:light-dark(#F5F2EC,#161513);--raise:light-dark(#FBFAF7,#1D1C19);
--ink:light-dark(#1C1B19,#EEEBE5);--ink-2:light-dark(#5E5A53,#A9A49A);--ink-3:light-dark(#8E887E,#77726A);
--line:light-dark(#E3DED4,#2B2925);--line-2:light-dark(#D3CDC1,#3A3732);
--hover:light-dark(#EFEBE3,#211F1C);--press:light-dark(#E8E3D9,#282622);
--accent:light-dark(#2F4DB8,#93A6F0);--on-accent:light-dark(#FFFFFF,#141414);--accent-soft:light-dark(#E4E8F6,#232840);
--danger:light-dark(#A63A26,#E8907C);
--c-nyt:light-dark(#1C1B19,#EEEBE5);--c-wordle:light-dark(#3D6B4A,#8FC29E);--c-word:light-dark(#916315,#D9B26A);
--c-geo:light-dark(#2D6A78,#7FBBC7);--c-trivia:light-dark(#6F4A7E,#C19BD0);--c-logic:light-dark(#A6452E,#E59580);--c-other:light-dark(#6F6A62,#A9A49A);
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
--serif:"Newsreader",Georgia,serif;--sans:"Geist",-apple-system,system-ui,sans-serif;
--ease:cubic-bezier(.2,.7,.2,1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--sans);overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

.app{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + var(--s6)) max(var(--s5),env(safe-area-inset-left)) calc(env(safe-area-inset-bottom) + 112px)}

/* Header */
.dateline{font:500 13px/1.35 var(--sans);color:var(--ink-2);margin:0 0 var(--s2);display:flex;justify-content:space-between;gap:var(--s3)}
h1{font:400 34px/1.05 var(--serif);letter-spacing:-.4px;margin:0;text-wrap:balance}
h1 em{font-style:italic;color:var(--ink-2)}
.prog{margin-top:var(--s5)}
.segs{display:flex;gap:3px;height:6px}
.segs i{flex:1;background:var(--line-2);border-radius:1px;transition:background .18s var(--ease)}
.segs i.on{background:var(--accent)}
.pline{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s2);font-size:13px;color:var(--ink-2);min-height:44px}
.pline b{font-weight:600;color:var(--ink)}
.pline .sp{flex:1}
.link{font:500 13px var(--sans);color:var(--accent);min-height:44px;padding:0 var(--s1)}
.link:active{opacity:.6}

/* Filters: segmented control */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line-2);border-radius:8px;padding:3px;margin:var(--s3) 0 var(--s5);background:var(--raise)}
.seg button{min-height:38px;border-radius:5px;font:500 14px var(--sans);color:var(--ink-2);transition:background .14s,color .14s}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg button:not([aria-pressed=true]):hover{background:var(--hover)}
.seg small{font-size:12px;opacity:.7;margin-left:3px}

/* Sections */
section{margin-bottom:var(--s5)}
.sh{display:flex;align-items:center;gap:var(--s2);padding:0 0 var(--s2);border-bottom:1px solid var(--ink)}
.sh h2{font:600 13px/1 var(--sans);margin:0;letter-spacing:.1px}
.sh .tick{width:8px;height:8px;border-radius:2px;background:var(--c)}
.sh span{margin-left:auto;font-size:13px;color:var(--ink-3)}
ul{list-style:none;margin:0;padding:0}

/* Rows */
.row{display:flex;align-items:center;min-height:60px;border-bottom:1px solid var(--line);transition:background .14s}
.row:hover{background:var(--hover)}
.ck{flex:none;width:44px;height:60px;display:grid;place-items:center;margin-left:-10px}
.box{width:24px;height:24px;border:1.5px solid var(--line-2);border-radius:6px;display:grid;place-items:center;transition:background .16s var(--ease),border-color .16s,transform .12s}
.ck:hover .box{border-color:var(--ink-3)}
.ck:active .box{transform:scale(.88)}
.box svg{width:14px;height:14px;stroke:var(--on-accent);stroke-width:2.4;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .18s var(--ease) .04s}
.done .box{background:var(--accent);border-color:var(--accent)}
.done .box svg{stroke-dashoffset:0}
.mark{flex:none;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;margin-right:var(--s3);
  background:color-mix(in srgb,var(--c) 11%,transparent);color:var(--c);font:500 18px/1 var(--serif);transition:opacity .16s}
.go{flex:1;display:flex;align-items:center;gap:var(--s3);min-height:60px;color:inherit;text-decoration:none;padding-right:var(--s1)}
.go:active{background:var(--press)}
.nm{flex:1}
.nm b{display:flex;align-items:center;gap:6px;font:500 16px/1.3 var(--sans);transition:color .16s}
.nm span{display:block;font-size:13px;color:var(--ink-3);margin-top:1px}
.nm .warn{color:var(--danger)}
.star{width:11px;height:11px;fill:var(--ink-3);flex:none}
.arr{width:16px;height:16px;stroke:var(--ink-3);stroke-width:1.6;fill:none;flex:none;transition:transform .14s var(--ease),stroke .14s}
.go:hover .arr{transform:translate(2px,-2px);stroke:var(--ink)}
.done .nm b{color:var(--ink-3)}
.done .mark{opacity:.45}

/* Edit mode row controls */
.ib{flex:none;width:40px;height:44px;display:grid;place-items:center;border-radius:6px;color:var(--ink-2)}
.ib:hover{background:var(--press)}.ib:active{transform:scale(.94)}
.ib svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.6;fill:none}
.ib[aria-pressed=true]{color:var(--accent)}.ib[aria-pressed=true] svg{fill:currentColor}
.ib.del{color:var(--danger)}
.ib:disabled{opacity:.25;pointer-events:none}
.editnote{font-size:13px;color:var(--ink-2);margin:0 0 var(--s4);padding:var(--s3) var(--s4);border:1px solid var(--line-2);border-radius:8px;background:var(--raise)}
.danger-zone{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s5)}
.btn{min-height:44px;padding:0 var(--s4);border:1px solid var(--line-2);border-radius:8px;font:500 14px var(--sans);background:var(--raise);transition:background .14s,transform .1s}
.btn:hover{background:var(--hover)}.btn:active{transform:scale(.98);background:var(--press)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.empty{padding:var(--s7) 0;text-align:center;color:var(--ink-2)}
.empty p{font:400 22px/1.2 var(--serif);color:var(--ink);margin:0 0 var(--s1)}
.foot{font-size:13px;color:var(--ink-3);margin-top:var(--s6);line-height:1.5}

/* Bottom toolbar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);border-top:1px solid var(--line);
  padding:var(--s2) max(var(--s4),env(safe-area-inset-right)) calc(var(--s2) + env(safe-area-inset-bottom)) max(var(--s4),env(safe-area-inset-left))}
.bar>div{max-width:600px;margin:0 auto;display:flex;gap:var(--s2);align-items:center}
.sf{flex:1;position:relative}
.sf svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-3);stroke-width:1.8;fill:none;pointer-events:none}
.sf input{width:100%;height:44px;border:1px solid var(--line-2);border-radius:8px;background:var(--raise);padding:0 var(--s3) 0 36px;font-size:16px;-webkit-appearance:none;appearance:none}
.sf input::placeholder{color:var(--ink-3)}
.sf input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.tb{flex:none;height:44px;min-width:44px;padding:0 var(--s3);border:1px solid var(--line-2);border-radius:8px;background:var(--raise);display:grid;place-items:center;font:500 14px var(--sans);transition:background .14s,transform .1s}
.tb:active{transform:scale(.96);background:var(--press)}
.tb svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none}
.tb.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tb[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Sheet */
dialog{border:1px solid var(--line-2);border-radius:8px;padding:var(--s5);width:min(440px,calc(100vw - 32px));background:var(--bg);color:var(--ink);box-shadow:0 24px 64px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(20,18,15,.32)}
dialog h3{font:400 22px/1.2 var(--serif);margin:0 0 var(--s4)}
label{display:block;font:600 13px var(--sans);margin:var(--s4) 0 6px;color:var(--ink-2)}
label small{font-weight:400;color:var(--ink-3)}
dialog input,dialog select{width:100%;height:44px;padding:0 var(--s3);border:1px solid var(--line-2);border-radius:6px;background:var(--raise);font-size:16px}
dialog .acts{display:flex;justify-content:flex-end;gap:var(--s2);margin-top:var(--s5)}
.err{color:var(--danger);font-size:13px;margin:var(--s2) 0 0;min-height:1em}
@media(max-width:600px){
  .app{padding-left:max(var(--s4),env(safe-area-inset-left));padding-right:max(var(--s4),env(safe-area-inset-right));padding-top:calc(env(safe-area-inset-top) + var(--s5))}
  h1{font-size:30px}
  dialog{margin:auto 0 0;width:100%;max-width:100%;border-radius:12px 12px 0 0;border-width:1px 0 0;padding-bottom:calc(var(--s5) + env(safe-area-inset-bottom))}
}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,8px);opacity:0;pointer-events:none;z-index:9;
  background:var(--ink);color:var(--bg);border-radius:8px;padding:0 var(--s2) 0 var(--s4);min-height:44px;display:flex;align-items:center;gap:var(--s3);font-size:14px;white-space:nowrap;transition:opacity .16s,transform .16s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--bg);font-weight:600;min-height:44px;padding:0 var(--s2);text-decoration:underline;text-underline-offset:3px}
.toast button:empty{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header>
    <p class="dateline"><span id="date"></span><span id="best" class="num"></span></p>
    <h1 id="greet"></h1>
    <div class="prog" aria-live="polite">
      <div class="segs" id="segs" aria-hidden="true"></div>
      <div class="pline num">
        <span id="count"></span><span aria-hidden="true">·</span><span id="streak"></span>
        <span class="sp"></span>
        <button class="link" id="share">Copy results</button>
      </div>
    </div>
  </header>

  <div class="seg" id="filters" role="group" aria-label="Show"></div>
  <p class="editnote" id="editnote" hidden>Star favourites to pin them on top, reorder with the arrows, or tap a name to edit its link.</p>
  <div id="list"></div>
  <div class="danger-zone" id="dz" hidden>
    <button class="btn" id="resetDay">Clear today’s ticks</button>
    <button class="btn" id="resetAll">Restore default games</button>
  </div>
  <p class="foot">Each game opens on its own site. Your list and streaks are saved in this browser, so every friend you share the link with keeps their own. On iPhone, tap Share → Add to Home Screen.</p>
</main>

<nav class="bar" aria-label="Tools"><div>
  <label class="sf" style="margin:0"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
    <input id="q" type="search" placeholder="Search games" aria-label="Search games" enterkeyhint="search" autocomplete="off"></label>
  <button class="tb" id="editBtn" aria-pressed="false">Edit</button>
  <button class="tb pri" id="addBtn" aria-label="Add a game"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div></nav>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form id="form" novalidate>
    <h3 id="dlgTitle">Add a game</h3>
    <label for="fName">Name</label><input id="fName" maxlength="40" placeholder="Semantle" autocomplete="off">
    <label for="fUrl">Link</label><input id="fUrl" type="url" inputmode="url" placeholder="https://semantle.com" autocomplete="off">
    <label for="fPub">Publisher <small>optional</small></label><input id="fPub" maxlength="40" placeholder="Independent" autocomplete="off">
    <label for="fCat">Section</label><select id="fCat"></select>
    <p class="err" id="err" role="alert"></p>
    <div class="acts"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn pri" type="submit">Save</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="tact" type="button"></button></div>

<script>
{
const CATS=[["nyt","New York Times"],["wordle","Wordle variants"],["word","Word"],["geo","Geography"],["trivia","Trivia"],["logic","Numbers & logic"],["other","Other"]];
const CAT=Object.fromEntries(CATS);
const N="https://www.nytimes.com/";
const D=[
 ["Wordle",N+"games/wordle/index.html","nyt","New York Times"],["Connections",N+"games/connections","nyt","New York Times"],
 ["Strands",N+"games/strands","nyt","New York Times"],["The Mini",N+"crosswords/game/mini","nyt","New York Times"],
 ["Spelling Bee",N+"puzzles/spelling-bee","nyt","New York Times"],["Letter Boxed",N+"puzzles/letter-boxed","nyt","New York Times"],
 ["Crossword",N+"crosswords/game/daily","nyt","New York Times"],["Sudoku",N+"puzzles/sudoku","nyt","New York Times"],
 ["Tiles",N+"puzzles/tiles","nyt","New York Times"],["Pips",N+"games/pips","nyt","New York Times"],
 ["Sports Connections",N+"athletic/connections-sports-edition/","nyt","The Athletic"],
 ["Dordle","https://zaratustra.itch.io/dordle","wordle","Zaratustra"],["Quordle","https://www.merriam-webster.com/games/quordle/","wordle","Merriam-Webster"],
 ["Octordle","https://www.britannica.com/games/octordle/","wordle","Britannica"],["Duetle","","wordle",""],
 ["Waffle","https://wafflegame.net/daily","word","Independent"],["Contexto","https://contexto.me/","word","Independent"],["Dartle","","word",""],
 ["Worldle","https://worldlegame.io/","geo","Independent"],["Globle","https://globle-game.com/","geo","Independent"],
 ["Krillion","https://krillion.io/","trivia","Independent"],["Framed","https://framed.wtf/","trivia","Independent"],
 ["Nerdle","https://www.nerdlegame.com/","logic","Independent"]
].map(([name,url,cat,pub])=>({id:slug(name),name,url,cat,pub,fav:false}));
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"game"}

const ICON={
 check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 arr:'<svg class="arr" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>',
 star:'<svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>',
 mini:'<svg class="star" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>',
 up:'<svg viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></svg>',down:'<svg viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></svg>',
 x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>'};

const store={get(k,d){try{const v=localStorage.getItem("dg:"+k);return v?JSON.parse(v):d}catch(e){return d}},
 set(k,v){try{localStorage.setItem("dg:"+k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dayKey=(d=new Date())=>d.toLocaleDateString("en-CA");
const clone=o=>JSON.parse(JSON.stringify(o));

let games=store.get("games2",null)||clone(D);
let hist=store.get("hist",{}),best=store.get("best",0);
let filter="all",editing=false,editId=null,today=dayKey(),undo=null;

const doneSet=()=>new Set(hist[today]||[]);
const save=()=>{store.set("games2",games);store.set("hist",hist);store.set("best",best)};
function streak(){let n=0;const d=new Date();if(!(hist[dayKey(d)]||[]).length)d.setDate(d.getDate()-1);
  while((hist[dayKey(d)]||[]).length){n++;d.setDate(d.getDate()-1)}return n}
function greeting(){const h=new Date().getHours();return h<5?"Up late":h<12?"Good morning":h<17?"Good afternoon":"Good evening"}
const initial=n=>(n.replace(/^the\s+/i,"")[0]||"?").toUpperCase();

function toggle(id,row){
  const s=doneSet(),was=s.has(id);was?s.delete(id):s.add(id);
  hist[today]=[...s];if(!s.size)delete hist[today];
  best=Math.max(best,streak());save();
  if(row){row.classList.toggle("done",!was);row.querySelector(".ck").setAttribute("aria-checked",!was);renderHead();renderCounts()}else render();
  if(!was&&s.size===games.length)toast("Every puzzle solved. See you tomorrow.");
}
function toast(msg,label,fn){$("tmsg").textContent=msg;$("tact").textContent=label||"";undo=fn||null;
  $("toast").classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>$("toast").classList.remove("show"),fn?5000:2400)}
$("tact").onclick=()=>{if(undo)undo();undo=null;$("toast").classList.remove("show")};

function renderHead(){
  const s=doneSet(),total=games.length,done=games.filter(g=>s.has(g.id)).length,st=streak(),b=Math.max(best,st);
  $("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  $("best").textContent=b>1?`Best run ${b} days`:"";
  $("greet").innerHTML=!total?`${greeting()}.<br><em>Your page is empty.</em>`:done===total?`${greeting()}.<br><em>All ${total} solved.</em>`:
    done?`${greeting()}.<br><em>${total-done} still to play.</em>`:`${greeting()}.<br><em>${total} puzzles today.</em>`;
  $("segs").innerHTML=games.map((_,i)=>`<i class="${i<done?"on":""}"></i>`).join("");
  $("count").innerHTML=`<b>${done}</b> of ${total} solved`;
  $("streak").textContent=st?`${st}-day streak`:"No streak yet";
}
function renderCounts(){
  const s=doneSet(),c={all:games.length,todo:games.filter(g=>!s.has(g.id)).length,done:games.filter(g=>s.has(g.id)).length,fav:games.filter(g=>g.fav).length};
  $("filters").innerHTML=[["all","All"],["todo","To do"],["done","Done"],["fav","Starred"]].map(([k,l])=>
    `<button data-filter="${k}" aria-pressed="${k===filter}">${l}<small class="num">${c[k]}</small></button>`).join("");
  document.querySelectorAll("section").forEach(sec=>{const ids=JSON.parse(sec.dataset.ids);const n=ids.filter(i=>s.has(i)).length;sec.querySelector(".sh span").textContent=`${n} of ${ids.length}`});
}
function rowHTML(g,s,list,i){
  const d=s.has(g.id),c=`--c:var(--c-${CAT[g.cat]?g.cat:"other"})`;
  const meta=!g.url?`<span class="warn">Add a link in Edit</span>`:g.pub&&g.pub!==CAT[g.cat]?`<span>${esc(g.pub)}</span>`:"";
  if(editing)return `<li class="row" style="${c}">
    <button class="ib" data-star="${esc(g.id)}" aria-pressed="${g.fav}" aria-label="Star ${esc(g.name)}">${ICON.star}</button>
    <div class="mark" aria-hidden="true">${esc(initial(g.name))}</div>
    <button class="go" data-edit="${esc(g.id)}" style="text-align:left"><div class="nm"><b>${esc(g.name)}</b>${meta}</div></button>
    <button class="ib" data-mv="${esc(g.id)}" data-dir="-1" aria-label="Move ${esc(g.name)} up" ${i===0?"disabled":""}>${ICON.up}</button>
    <button class="ib" data-mv="${esc(g.id)}" data-dir="1" aria-label="Move ${esc(g.name)} down" ${i===list.length-1?"disabled":""}>${ICON.down}</button>
    <button class="ib del" data-del="${esc(g.id)}" aria-label="Remove ${esc(g.name)}">${ICON.x}</button></li>`;
  const href=g.url||`https://www.google.com/search?q=${encodeURIComponent(g.name+" daily game")}`;
  return `<li class="row${d?" done":""}" style="${c}">
    <button class="ck" role="checkbox" aria-checked="${d}" data-ck="${esc(g.id)}" aria-label="${esc(g.name)} solved"><span class="box">${ICON.check}</span></button>
    <div class="mark" aria-hidden="true">${esc(initial(g.name))}</div>
    <a class="go" href="${esc(href)}" target="_blank" rel="noopener"><div class="nm"><b>${esc(g.name)}${g.fav?ICON.mini:""}</b>${meta}</div>${ICON.arr}</a></li>`;
}
function render(){
  renderHead();
  const s=doneSet(),q=$("q").value.trim().toLowerCase();
  const match=g=>(!q||(g.name+" "+(g.pub||"")).toLowerCase().includes(q))&&
    (editing||filter==="all"||(filter==="todo"&&!s.has(g.id))||(filter==="done"&&s.has(g.id))||(filter==="fav"&&g.fav));
  const groups=[];
  const favs=games.filter(g=>g.fav&&match(g));
  if(!editing&&favs.length&&filter!=="fav")groups.push(["fav","Starred",favs]);
  for(const[k,l]of CATS){const gs=games.filter(g=>(CAT[g.cat]?g.cat:"other")===k&&match(g)&&(editing||filter==="fav"||!g.fav));if(gs.length)groups.push([k,l,gs])}
  $("list").innerHTML=groups.length?groups.map(([k,l,gs])=>`<section data-ids='${esc(JSON.stringify(gs.map(g=>g.id)))}'>
    <div class="sh" style="--c:${k==="fav"?"var(--accent)":`var(--c-${k})`}"><i class="tick"></i><h2>${esc(l)}</h2><span class="num"></span></div>
    <ul>${gs.map((g,i)=>rowHTML(g,s,gs,i)).join("")}</ul></section>`).join(""):
    `<div class="empty"><p>${q?"Nothing by that name.":filter==="done"?"Nothing solved yet.":filter==="fav"?"No starred games.":filter==="todo"?"You’re all caught up.":"No games yet."}</p>${q?"Try another search, or add it with +.":filter==="fav"?"Tap Edit, then the star beside a game.":filter==="todo"?"Come back tomorrow for a fresh page.":""}</div>`;
  renderCounts();
  $("editnote").hidden=$("dz").hidden=!editing;
}

function openDlg(g){
  editId=g?g.id:null;$("dlgTitle").textContent=g?"Edit game":"Add a game";$("err").textContent="";
  $("fName").value=g?.name||"";$("fUrl").value=g?.url||"";$("fPub").value=g?.pub||"";$("fCat").value=g?.cat||"other";
  try{$("dlg").showModal()}catch(e){$("dlg").setAttribute("open","")}
  setTimeout(()=>(g&&!g.url?$("fUrl"):$("fName")).focus(),30);
}
$("fCat").innerHTML=CATS.map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join("");
$("cancel").onclick=()=>$("dlg").close();
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close()});
$("form").addEventListener("submit",e=>{
  e.preventDefault();
  const name=$("fName").value.trim(),pub=$("fPub").value.trim(),cat=$("fCat").value;let url=$("fUrl").value.trim();
  if(url&&!/^https?:\/\//i.test(url))url="https://"+url;
  if(!name){$("err").textContent="Give the game a name.";return}
  try{new URL(url)}catch(x){$("err").textContent="Paste the game’s web address.";return}
  if(editId)Object.assign(games.find(g=>g.id===editId),{name,url,pub,cat});
  else{let id=slug(name),n=2;while(games.some(g=>g.id===id))id=slug(name)+"-"+n++;games.push({id,name,url,pub,cat,fav:false})}
  save();$("dlg").close();render();toast(editId?"Saved":`Added ${name}`);
});

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t||!t.dataset)return;const d=t.dataset;
  if(d.ck)toggle(d.ck,t.closest(".row"));
  else if(d.filter){filter=d.filter;render()}
  else if(d.star){const g=games.find(x=>x.id===d.star);g.fav=!g.fav;t.setAttribute("aria-pressed",g.fav);save();renderCounts()}
  else if(d.edit)openDlg(games.find(x=>x.id===d.edit));
  else if(d.mv){const g=games.find(x=>x.id===d.mv),peers=games.filter(x=>x.cat===g.cat),j=peers.indexOf(g)+ +d.dir,o=peers[j];
    if(o){const a=games.indexOf(g),b=games.indexOf(o);[games[a],games[b]]=[games[b],games[a]];save();render();
      const btn=document.querySelector(`[data-mv="${CSS.escape(g.id)}"][data-dir="${d.dir}"]`);(btn&&!btn.disabled?btn:document.querySelector(`[data-mv="${CSS.escape(g.id)}"]:not(:disabled)`))?.focus()}}
  else if(d.del){const i=games.findIndex(x=>x.id===d.del),g=games[i];games.splice(i,1);save();render();
    toast(`Removed ${g.name}`,"Undo",()=>{games.splice(i,0,g);save();render()})}
});
$("q").addEventListener("input",render);
$("addBtn").onclick=()=>openDlg(null);
$("editBtn").onclick=()=>{editing=!editing;$("editBtn").setAttribute("aria-pressed",editing);$("editBtn").textContent=editing?"Done":"Edit";render()};
$("share").onclick=async()=>{
  const s=doneSet(),done=games.filter(g=>s.has(g.id));
  const txt=`Daily Grid · ${new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"})}\n${games.map(g=>s.has(g.id)?"■":"□").join("")}\n${done.length}/${games.length} solved${streak()?` · ${streak()}-day streak`:""}`;
  try{await navigator.clipboard.writeText(txt);toast("Results copied")}catch(e){toast("Couldn’t copy in this view")}
};
$("resetDay").onclick=()=>{const prev=hist[today];delete hist[today];save();render();toast("Today cleared","Undo",()=>{if(prev)hist[today]=prev;save();render()})};
$("resetAll").onclick=()=>{const prev=games;games=clone(D);save();render();toast("Defaults restored","Undo",()=>{games=prev;save();render()})};

const roll=()=>{const k=dayKey();if(k!==today){today=k;render()}};
setInterval(roll,60000);document.addEventListener("visibilitychange",roll);
render();
}
</script>
</body>
</html>
